[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hrpc-test"
version = "0.1.0"
description = "Cross-language wire-conformance vectors and normative spec for the bare-rpc / hrpc wire protocol"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Holepunch" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.hatch.build.targets.wheel]
packages = ["src/hrpc_test"]

# The fixtures live at the repo root so the JS and Python entry points read the
# same files; the wheel carries a copy inside the package
[tool.hatch.build.targets.wheel.force-include]
"fixtures" = "hrpc_test/fixtures"
